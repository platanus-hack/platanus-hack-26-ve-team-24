<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#F4F8F7;color:#12302F;font:400 15px/1.3 'Source Sans 3',sans-serif}
.bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font:700 16px 'Source Sans 3';letter-spacing:.12em;color:#0B6E69}
.field{margin:0 16px 14px;display:flex;border:2px solid #0B6E69}.field span{flex:1;padding:11px;font:600 14px monospace}.field b{background:#0B6E69;color:#fff;padding:11px 14px;font:700 13px 'Source Sans 3';letter-spacing:.08em}
.verdict{background:#0B6E69;color:#fff;margin:0 16px;padding:18px 16px;position:relative}
.verdict small{font:600 11px 'Source Sans 3';letter-spacing:.16em;opacity:.85}
.verdict h1{font:700 44px/1 'Source Sans 3';margin:4px 0 6px}
.verdict p{font:600 14px 'Source Sans 3'}
.loupe{position:absolute;right:14px;top:14px;width:86px;height:86px;border-radius:50%;border:4px solid #B8860B;background:#F4F8F7;color:#12302F;display:grid;place-items:center;font:700 12px/1.1 monospace;text-align:center}
.steps{margin:14px 16px;display:grid;gap:10px}
.step{display:grid;grid-template-columns:36px 1fr 74px;align-items:center;border:1.5px solid #0B6E69;background:#fff}
.step i{font:700 22px 'Source Sans 3';font-style:normal;background:#0B6E69;color:#fff;height:100%;display:grid;place-items:center}
.step div{padding:9px 10px}.step b{display:block;font:700 15px 'Source Sans 3'}.step code{font:400 11px monospace;color:#4a6866}
.step em{font:700 11px 'Source Sans 3';font-style:normal;letter-spacing:.1em;color:#0B6E69;text-align:center;border-left:1.5px solid #0B6E69;padding:10px 0}
.facts{margin:0 16px;display:grid;grid-template-columns:1fr 1fr;border:1.5px solid #0B6E69;background:#fff}
.facts div{padding:8px 10px;border:.5px solid #0B6E69;font:600 12px 'Source Sans 3'}.facts b{display:block;font:700 10px 'Source Sans 3';letter-spacing:.14em;color:#B8860B}
</style></head><body>
<div class="bar">AUDGENTIC<span>COMPROBAR</span></div>
<div class="field"><span>s_7f3a91c0</span><b>COMPROBAR</b></div>
<div class="verdict"><small>RESULTADO</small><h1>GENUINO</h1><p>Anclado en el bloque 6 412 088</p><div class="loupe">0x9be4<br>…c21a<br>=</div></div>
<div class="steps">
<div class="step"><i>1</i><div><b>Cadena</b><code>evento 12 de 12 · enlaces ok</code></div><em>COINCIDE</em></div>
<div class="step"><i>2</i><div><b>Secuencia</b><code>seq 1–12 · sin huecos</code></div><em>COMPLETA</em></div>
<div class="step"><i>3</i><div><b>Ancla pública</b><code>raíz leída por RPC</code></div><em>COINCIDE</em></div>
</div>
<div class="facts"><div><b>AGENTE</b>billing-bot</div><div><b>EVENTOS</b>12</div><div><b>BLOQUE</b>6 412 088</div><div><b>FECHA</b>24 OCT 2026</div></div>
</body></html>
