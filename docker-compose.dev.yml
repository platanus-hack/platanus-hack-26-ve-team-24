# Override de desarrollo — Podman.
#
# Se combina con el archivo base:
#   podman compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Monta el repo como volumen (:z por SELinux) y arranca Vite+ con HMR.
services:
  postgres:
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      target: dev
      dockerfile: Dockerfile.dev
    image: localhost/trust-dev:latest
    command: pnpm start:dev
    volumes:
      - .:/app:z
      # Volúmenes anónimos: evitan que el node_modules del host pise el de
      # la imagen, tanto en la raíz como en el workspace web.
      - /app/node_modules
      - /app/web/node_modules
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      target: dev
      dockerfile: Dockerfile.dev
    image: localhost/trust-dev:latest
    command: pnpm --filter web dev
    volumes:
      - .:/app:z
      - /app/node_modules
      - /app/web/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - api
