# Producción/demo — Podman.
#
# Un contenedor de aplicación:
#   api -> Nest con HTTP y SSE
#
# Fedora + SELinux enforcing: los volúmenes llevan :z (compartido) o :Z
# (exclusivo). Sin eso, el contenedor no puede leer ni escribir.
#
# Uso:
#   podman compose up -d --build
#   podman compose logs -f api
#   podman compose down
name: trust

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trust}
      POSTGRES_DB: ${POSTGRES_DB:-trust}
    volumes:
      # :Z porque solo Postgres monta este volumen.
      - pgdata:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trust} -d ${POSTGRES_DB:-trust}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Solo para desarrollo local. En prod/demo, comenta este bloque.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  api:
    build:
      context: .
      target: api
    image: localhost/trust-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE: api
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      - postgres
    # La app reintenta la conexión a Postgres al arrancar. No usamos
    # condition: service_healthy porque podman-compose lo soporta de forma
    # inconsistente entre versiones.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
